name: BIST Veri Güncelle

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: BIST verilerini al
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          symbols = [
              "THYAO","ASELS","TUPRS","GARAN","AKBNK",
              "EREGL","KCHOL","SISE","FROTO","BIMAS",
              "TCELL","PETKM","PGSUS","TOASO","SAHOL"
          ]

          data = {
              "_meta": {
                  "updatedAt": datetime.now(timezone.utc).isoformat()
              }
          }

          for symbol in symbols:
              try:
                  url = (
                      "https://query1.finance.yahoo.com/v8/finance/chart/"
                      + symbol + ".IS?range=6mo&interval=1d"
                  )

                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  with urllib.request.urlopen(req, timeout=15) as r:
                      j = json.load(r)

                  result = j["chart"]["result"][0]
                  closes = [
                      x for x in result["indicators"]["quote"][0]["close"]
                      if x is not None
                  ]

                  if closes:
                      price = closes[-1]
                      previous = closes[-2] if len(closes) > 1 else price

                      data[symbol] = {
                          "price": price,
                          "changePercent":
                              (price - previous) / previous * 100,
                          "closes": closes
                      }

              except Exception as e:
                  print(symbol, e)

          with open("data.json", "w") as f:
              json.dump(data, f)

          print("Veri güncellendi.")
          PY

      - name: Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "BIST verilerini güncelle"
          git push
