name: BIST Veri Güncelle

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths-ignore:
      - "data.json"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: BIST verilerini çek
        env:
          SYMBOLS: "AEFES,AGHOL,AKBNK,AKSA,AKSEN,ALARK,ALBRK,ALFAS,ARCLK,ASELS,ASTOR,AYDEM,AYGAZ,BAGFS,BIMAS,BRSAN,BRYAT,CCOLA,CIMSA,CLEBI,DOAS,DOHOL,ECILC,ECZYT,EGEEN,EKGYO,ENERY,ENJSA,ENKAI,EREGL,FROTO,GARAN,GESAN,GUBRF,GWIND,HALKB,HEKTS,ISCTR,ISDMR,ISFIN,ISGYO,ISMEN,KARSN,KCAER,KCHOL,KONTR,KOZAA,KOZAL,KRDMD,LOGO,MAVI,MGROS,MIATK,ODAS,OTKAR,OYAKC,PASEU,PETKM,PGSUS,QUAGR,REEDR,SAHOL,SASA,SDTTR,SISE,SKBNK,SMRTG,SOKM,TABGD,TAVHL,TCELL,THYAO,TKFEN,TMSN,TOASO,TRCAS,TSKB,TTKOM,TTRAK,TUKAS,TUPRS,ULKER,VAKBN,VESBE,VESTL,YEOTK,YKBNK,YYLGD,ZOREN"

        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone

          symbols = os.environ["SYMBOLS"].split(",")
          db = {
              "_meta": {
                  "updatedAt": datetime.now(timezone.utc).isoformat()
              }
          }

          for s in symbols:
              try:
                  url = (
                      "https://query1.finance.yahoo.com/v8/finance/chart/"
                      + urllib.parse.quote(s + ".IS")
                      + "?range=6mo&interval=1d&events=history"
                  )

                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  with urllib.request.urlopen(req, timeout=15) as r:
                      j = json.load(r)

                  result = j["chart"]["result"][0]
                  q = result["indicators"]["quote"][0]

                  closes = [
                      x for x in q.get("close", [])
                      if x is not None
                  ]

                  if not closes:
                      continue

                  prev = closes[-2] if len(closes) > 1 else None
                  price = closes[-1]

                  pct = (
                      ((price - prev) / prev * 100)
                      if prev else None
                  )

                  dates = result.get("timestamp", [])

                  db[s] = {
                      "price": price,
                      "changePercent": pct,
                      "closes": closes,
                      "date": (
                          datetime.fromtimestamp(
                              dates[-1],
                              timezone.utc
                          ).strftime("%Y-%m-%d")
                          if dates else ""
                      )
                  }

                  time.sleep(0.12)

              except Exception as e:
                  print("SKIP", s, e)

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(
                  db,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

          print("Hisse sayısı:", len(db) - 1)
          PY

      - name: Veriyi kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "BIST verilerini güncelle"
          git push
