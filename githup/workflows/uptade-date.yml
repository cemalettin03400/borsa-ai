name: BIST Veri Güncelle

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths-ignore:
      - "data.json"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: BIST verilerini çek
        env:
          SYMBOLS: "AEFES,AKBNK,AKSA,AKSEN,ALARK,ARCLK,ASELS,ASTOR,AYGAZ,BIMAS,BRSAN,CCOLA,CIMSA,DOAS,DOHOL,ECILC,EKGYO,ENKAI,EREGL,FROTO,GARAN,GESAN,GUBRF,HALKB,HEKTS,ISCTR,ISDMR,KARSN,KCHOL,KONTR,KOZAA,KOZAL,KRDMD,MAVI,MGROS,ODAS,OTKAR,OYAKC,PETKM,PGSUS,SAHOL,SASA,SISE,SOKM,TAVHL,TCELL,THYAO,TKFEN,TOASO,TSKB,TTKOM,TTRAK,TUPRS,ULKER,VAKBN,VESTL,YKBNK,ZOREN"
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.parse
          from datetime import datetime, timezone

          symbols = os.environ["SYMBOLS"].split(",")
          db = {
              "_meta": {
                  "updatedAt": datetime.now(timezone.utc).isoformat()
              }
          }

          for s in symbols:
              try:
                  url = (
                      "https://query1.finance.yahoo.com/v8/finance/chart/"
                      + urllib.parse.quote(s + ".IS")
                      + "?range=6mo&interval=1d&events=history"
                  )

                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  with urllib.request.urlopen(req, timeout=15) as r:
                      data = json.load(r)

                  result = data["chart"]["result"][0]
                  quote = result["indicators"]["quote"][0]

                  closes = [
                      x for x in quote.get("close", [])
                      if x is not None
                  ]

                  if not closes:
                      continue

                  price = closes[-1]
                  previous = closes[-2] if len(closes) > 1 else None

                  change = (
                      ((price - previous) / previous * 100)
                      if previous else None
                  )

                  timestamps = result.get("timestamp", [])

                  date = ""
                  if timestamps:
                      date = datetime.fromtimestamp(
                          timestamps[-1],
                          timezone.utc
                      ).strftime("%Y-%m-%d")

                  db[s] = {
                      "price": price,
                      "changePercent": change,
                      "closes": closes,
                      "date": date
                  }

              except Exception as e:
                  print("SKIP", s, e)

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(
                  db,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

          print("Hisse sayısı:", len(db) - 1)
          PY

      - name: Veriyi kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "BIST verilerini güncelle"
          git push
